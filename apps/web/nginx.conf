# ItemLife 前端：托管 SPA 静态资源 + 反向代理 /api 到 NestJS
# 构建上下文为仓库根目录，本文件由 Dockerfile 复制到 /etc/nginx/conf.d/default.conf

# 外层反向代理若已终止 TLS，回源请求里带有原始协议；否则用本机 $scheme
map $http_x_forwarded_proto $proxy_x_forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

upstream itemlife_api {
  server api:3000;
  keepalive 16;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 8m;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # HSTS 由最外层反向代理下发：内网 HTTP 直连场景不能带，避免浏览器强制升级
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # 构建产物带内容哈希，可长缓存
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location /api/ {
    proxy_pass http://itemlife_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 60s;
  }

  # SPA 前端路由回退
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
