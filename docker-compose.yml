# ItemLife 生产编排：docker compose up -d --build
# 宿主机只发布 web 的 HTTP 端口，TLS 由容器外部的反向代理终止（设计报告 10.5）
name: itemlife

services:
  log-collector:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    image: itemlife/api:latest
    entrypoint: ['node', 'apps/api/log-collector.mjs']
    environment:
      LOG_DIR: /logs
      LOG_PORT: '15140'
      LOG_MAX_BYTES: '20971520'
      LOG_RETENTION_DAYS: '30'
      TZ: Asia/Shanghai
    ports:
      - '127.0.0.1:15140:15140/udp'
    volumes:
      - logs:/logs
    networks:
      - backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: prod
    image: itemlife/web:latest
    ports:
      - '${WEB_PORT:-80}:80'
    networks:
      - frontend
      - backend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/healthz']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: syslog
      options:
        syslog-address: 'udp://127.0.0.1:15140'
        syslog-format: rfc5424micro
        tag: itemlife-web

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    image: itemlife/api:latest
    env_file:
      - .env
    environment:
      # 容器内地址覆盖 .env 中面向宿主机调试的连接串
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER:-itemlife}:${DB_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-itemlife}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      TRUST_PROXY: ${TRUST_PROXY:-2}
      SEED_ON_START: ${SEED_ON_START:-0}
    volumes:
      - uploads:/repo/apps/api/uploads
    networks:
      - backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/v1/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    logging:
      driver: syslog
      options:
        syslog-address: 'udp://127.0.0.1:15140'
        syslog-format: rfc5424micro
        tag: itemlife-api

  mysql:
    image: mysql:8.4
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --default-time-zone=+00:00
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-itemlife}
      MYSQL_USER: ${MYSQL_USER:-itemlife}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: syslog
      options:
        syslog-address: 'udp://127.0.0.1:15140'
        syslog-format: rfc5424micro
        tag: itemlife-mysql

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD}']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: syslog
      options:
        syslog-address: 'udp://127.0.0.1:15140'
        syslog-format: rfc5424micro
        tag: itemlife-redis

volumes:
  mysql_data:
  redis_data:
  uploads: # 物品图片等用户上传文件
  logs: # 容器日志：跨容器重建保留，20 MB 分片，保留 30 天

networks:
  frontend: # 仅 web：发布 HTTP 端口，承接外部反向代理回源
    driver: bridge
  backend: # web / api / mysql / redis：内部互通，不直连外网
    driver: bridge
    internal: true
