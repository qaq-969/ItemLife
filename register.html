<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>注册 · ItemLife</title>
    <link rel="stylesheet" href="./assets/auth.css" />
  </head>
  <body class="register">
    <main class="page">
      <section class="story">
        <header class="brand"><span class="brand-mark">IL</span><div><strong>ItemLife</strong><small>开启你的物品生活记录</small></div></header>
        <div class="story-copy">
          <p class="kicker">CREATE YOUR SPACE</p>
          <h1>从今天起，<br />看见每次拥有。</h1>
          <p>建立专属于你的生活账本，把支出、物品与长期价值放在同一个清晰视角里。</p>
        </div>
        <p class="story-foot">柔和平衡 · 清晰克制 · 长久耐看</p>
      </section>
      <section class="form-side">
        <article class="card glass">
          <p class="step">02 · CREATE ACCOUNT</p>
          <h2>创建账号</h2>
          <p class="subtitle">注册后即可开始记录；建议登录后在账号安全中开启两步验证。</p>
          <form class="form">
            <div class="fields-two">
              <div class="field-row"><label for="email">邮箱</label><input class="field" id="email" type="email" autocomplete="username" placeholder="name@example.com" /></div>
              <div class="field-row"><label for="nickname">昵称（可选）</label><input class="field" id="nickname" type="text" autocomplete="nickname" placeholder="如何称呼你" /></div>
            </div>
            <div class="fields-two">
              <div class="field-row"><label for="password">密码</label><input class="field" id="password" type="password" autocomplete="new-password" placeholder="设置登录密码" /><p class="hint">至少 8 位，并包含字母与数字。</p></div>
              <div class="field-row"><label for="confirm">确认密码</label><input class="field" id="confirm" type="password" autocomplete="new-password" placeholder="再次输入密码" /></div>
            </div>
            <div class="actions"><button class="primary" type="button">创建账号</button></div>
          </form>
          <a class="form-link" href="./login.html">已经有账号？<strong>返回登录</strong></a>
        </article>
      </section>
    </main>
  </body>
</html>
