<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 · ItemLife</title>
    <link rel="stylesheet" href="./assets/auth.css" />
  </head>
  <body class="login">
    <main class="page">
      <section class="story">
        <header class="brand"><span class="brand-mark">IL</span><div><strong>ItemLife</strong><small>珍惜每件物品的时光</small></div></header>
        <div class="story-copy">
          <p class="kicker">WELCOME BACK</p>
          <h1>回到你的<br />生活账本。</h1>
          <p>每笔收支都有来处，每件物品都有故事。继续记录，也继续理解自己的生活。</p>
        </div>
        <p class="story-foot">暮山蓝 · 沉静可信　晚桃粉 · 温柔包容</p>
      </section>
      <section class="form-side">
        <article class="card glass">
          <p class="step">01 · SIGN IN</p>
          <h2>欢迎回来</h2>
          <p class="subtitle">使用邮箱和密码登录。已开启两步验证的账号将在下一步输入动态码。</p>
          <form class="form">
            <div class="field-row"><label for="email">邮箱</label><input class="field" id="email" type="email" autocomplete="username" placeholder="name@example.com" /></div>
            <div class="field-row"><label for="password">密码</label><input class="field" id="password" type="password" autocomplete="current-password" placeholder="请输入登录密码" /></div>
            <div class="actions"><button class="primary" type="button">登录</button></div>
          </form>
          <a class="form-link" href="./register.html">还没有账号？<strong>创建账号</strong></a>
        </article>
      </section>
    </main>
  </body>
</html>
