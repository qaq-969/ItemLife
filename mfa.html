<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>两步验证 · ItemLife</title>
    <link rel="stylesheet" href="./assets/auth.css" />
  </head>
  <body class="mfa">
    <main class="page">
      <section class="mfa-wrap">
        <header class="brand"><span class="brand-mark">IL</span><div><strong>ItemLife</strong><small>安全验证</small></div></header>
        <article class="card glass">
          <p class="step">03 · TWO-STEP VERIFICATION</p>
          <h2>确认是你本人</h2>
          <p class="subtitle">请输入身份验证器中显示的 6 位动态码；无法获取动态码时，也可以使用一枚恢复码。</p>
          <form class="form">
            <div class="field-row"><label for="code">动态码 / 恢复码</label><input class="field code-field" id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="12" placeholder="000000" /></div>
            <div class="actions"><button class="primary" type="button">验证并登录</button></div>
          </form>
          <a class="form-link" href="./login.html"><strong>返回登录</strong></a>
          <p class="security-note">动态码每 30 秒更新。ItemLife 不会通过邮件或消息向你索取验证码。</p>
        </article>
      </section>
    </main>
  </body>
</html>
